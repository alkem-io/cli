query digitalTwinDemo($spaceNameID: UUID_NAMEID!) {
  space(ID: $spaceNameID) {
    id
    subspaces {
      profile {
        displayName
        tagline
      }
      context {
        vision
        impact
      }
      collaboration {
        calloutsSet {
          id
          callouts {
            comments {
              messagesCount
            }
            framing {
              profile {
                displayName
                tagline
              }
            }
          }
        }
      }
    }
  }
}
