query innovationFlowStates {
  spaces(filter: { visibilities: [DEMO, ARCHIVED, ACTIVE] }) {
    subspaces {
      collaboration {
        id
        innovationFlow {
          id
        }
        calloutsSet {
          id
          callouts {
            nameID
            framing {
              profile {
                id
                tagsets {
                  name
                }
              }
            }
          }
        }
      }
      subspaces {
        collaboration {
          innovationFlow {
            id
          }
          calloutsSet {
            id
            callouts {
              nameID
              framing {
                profile {
                  id
                  tagsets {
                    name
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
