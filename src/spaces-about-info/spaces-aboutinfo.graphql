query spacesAboutInfo {
  spaces(filter: { visibilities: [DEMO, ACTIVE] }) {
    ...SpaceAbout
    subspaces {
      ...SpaceAbout
      subspaces {
        ...SpaceAbout
      }
    }
  }
}

fragment SpaceAbout on Space {
  id
  nameID
  level
  about {
    why
    who
    profile {
      displayName
      description
    }
  }
  visibility
  account {
    id
    type
    host {
      id
      profile {
        displayName
      }
    }
  }
}
