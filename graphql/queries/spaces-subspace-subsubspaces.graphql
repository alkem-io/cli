query spaceSubspaceSubspaces($spaceId: UUID!, $subspaceId: UUID!) {
  lookup {
    space(ID: $spaceId) {
      id
      nameID
      about {
        profile {
          displayName
          description
        }
      }
      collaboration {
        id
      }
    }
    subspace: space(ID: $subspaceId) {
      id
      nameID
      about {
        profile {
          displayName
          description
        }
      }
      collaboration {
        id
        calloutsSet {
          id
          callouts {
            id
          }
        }
      }
      subspaces {
        nameID
        about {
          profile {
            displayName
            tagline
            description
            visuals {
              id
              name
              uri
            }
            references {
              name
              uri
              description
            }
            tagset {
              tags
            }
          }
        }
        community {
          id
          roleSet {
            leadOrganizations: organizationsInRole(role: LEAD) {
              nameID
              profile {
                id
                displayName
              }
            }
            memberOrganizations: organizationsInRole(role: MEMBER) {
              nameID
              profile {
                id
                displayName
              }
            }
          }
        }
      }
    }
  }
}
