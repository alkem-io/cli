query spaceSubspacesCollaboration {
  spaces {
    id
    nameID
    collaboration {
      id
      calloutsSet {
        id
        callouts {
          id
        }
      }
    }
    subspaces {
      id
      nameID
      collaboration {
        id
        calloutsSet {
          id
          callouts {
            id
          }
        }
      }
    }
  }
}
